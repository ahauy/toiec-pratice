services:
  - type: web
    name: toeic-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/main
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false        # điền trên Render dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_TOKEN
        sync: false        # tùy chọn
      - key: PORT
        value: 10000
